controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      # type: effort_controllers/JointGroupEffortController
      # type: effort_controllers/JointTrajectoryController
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint_s
      - joint_l
      - joint_u
      - joint_r
      - joint_b
      - joint_t
    command_interfaces:
      - position
    state_interfaces:
      - position



gripper_controller:
  ros__parameters:
    joints: 
     - robotiq_85_left_knuckle_joint
    gains:
      robotiq_85_left_knuckle_joint: 
        p: 300.0  
        d: 8.0 
        i: 0.0
        i_clamp: 1.0
    #   # ff_velocity_scale: 1.0
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.01
      robotiq_85_left_knuckle_joint:
        goal: 0.002     # tighten goal tolerance
    command_interfaces: 
      - [position]
    state_interfaces:
      - [position, velocity] 